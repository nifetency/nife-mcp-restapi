version: '3.8'

services:
  restapi-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: restapi-mcp-server:latest
    container_name: restapi-mcp-server
    
    # Environment variables from .env file
    env_file:
      - .env
    
    # Override specific environment variables if needed
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-8080}
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-0.0.0.0}
      - ENABLE_HTTP_ENDPOINT=${ENABLE_HTTP_ENDPOINT:-true}
    
    # Port mapping
    ports:
      - "${MCP_SERVER_PORT:-8080}:8080"
    
    # Interactive mode for stdio communication
    stdin_open: true
    tty: true
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  default:
    name: mcp-network
